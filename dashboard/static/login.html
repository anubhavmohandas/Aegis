<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aegis — Sign in</title>
<link rel="icon" type="image/png" href="favicon.png">
<!-- Applies the saved theme before first paint. External, not inline, so the
     Content-Security-Policy can forbid inline script -- see theme-boot.js. -->
<script src="theme-boot.js"></script>
<!-- Fonts are self-hosted in style.css (@font-face -> fonts/*.woff2). This page
     used to <link> them from fonts.googleapis.com, so the login screen of a
     local-only console announced itself to a third party before you'd even
     signed in. -->
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

<div class="login-card" id="card">
  <div class="login-logo-wrap">
    <span class="login-logo" role="img" aria-label="Aegis logo"></span>
  </div>
  <div class="login-title">AEGIS</div>
  <div class="login-sub">Memory</div>

  <form class="login-form" id="form" autocomplete="off">
    <div class="login-error" id="error" hidden></div>
    <div class="login-field">
      <label for="username">Operator</label>
      <input id="username" name="username" type="text" autocapitalize="none"
             autocorrect="off" spellcheck="false" autofocus required>
    </div>
    <div class="login-field">
      <label for="password">Passphrase</label>
      <input id="password" name="password" type="password" required>
    </div>
    <button class="login-submit" id="submit" type="submit">Authenticate</button>
  </form>

  <div class="login-foot">local console · sessions expire after 12h</div>
</div>

<script src="login.js"></script>
</body>
</html>
