name: Build packages

# Manual trigger (Actions tab -> Build packages -> Run workflow) so a build
# can be produced on demand, plus an automatic build whenever a version tag
# is pushed. Windows can only be honestly built on windows-latest --
# PyInstaller does not cross-compile -- so this replaces trying to produce a
# Windows .exe from a non-Windows machine.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  # Nothing ran tests/ before this job existed -- the two build jobs run
  # validate_runtime.py (an import + HTTP smoke check), which is not the same
  # thing, and pytest was in no requirements file at all. A tagged release
  # could therefore ship with the whole suite red and nobody the wiser.
  # macOS rather than ubuntu: several checks touch macOS-only paths
  # (rule_engine's SIP branch, session_monitor's ioreg backend), and the ones
  # that don't are platform-agnostic anyway.
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-common.txt -r requirements-macos.txt -r requirements-dev.txt

      - name: Test suite
        run: pytest tests/ -q

      # The module self-checks are the other half of this codebase's testing:
      # each is the "one runnable check" behind a piece of non-trivial logic and
      # lives in the module it guards, so pytest never collects them.
      - name: Module self-checks
        run: |
          for m in core.rule_engine core.severity_engine core.enrichment \
                   core.evidence core.process_notes core.session_monitor \
                   core.database; do
            echo "--- $m"
            python -m "$m"
          done

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Confirmed bug this exists to prevent (the v2.1.1 release): the tag was
      # pushed from a commit where core/version.py still read 2.1.0, so the
      # build produced aegis-2.1.0.dmg / aegis-2.1.0-setup.exe and the release
      # job happily published a 2.1.0 build under a v2.1.1 tag. Every installed
      # 2.1.0 copy then saw "2.1.1 available" forever, downloading and
      # reinstalling the version it was already running on every click of the
      # update button. Nothing anywhere checked that the tag described what was
      # actually being built -- so check it here, BEFORE the ~10 minutes of
      # building, and fail the release rather than publish a broken one.
      # windows-installer.iss is checked too: it carries a hand-synced copy of
      # the version (Inno Setup can't import Python), which is a second way for
      # the same drift to reach users.
      - name: Tag matches core/version.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash        # windows-latest defaults to pwsh, where this is not valid
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SRC=$(python -c "from core.version import __version__; print(__version__)")
          ISS=$(grep -oE '^#define MyAppVersion "[^"]+"' packaging/windows-installer.iss | sed -E 's/.*"(.*)"/\1/')
          echo "tag=$TAG  core/version.py=$SRC  windows-installer.iss=$ISS"
          [ "$TAG" = "$SRC" ] || { echo "::error::tag $GITHUB_REF_NAME does not match core/version.py ($SRC) -- bump it and re-tag"; exit 1; }
          [ "$ISS" = "$SRC" ] || { echo "::error::packaging/windows-installer.iss ($ISS) does not match core/version.py ($SRC) -- bump both together"; exit 1; }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-common.txt -r requirements-windows.txt pyinstaller

      - name: Runtime smoke validation
        run: python packaging/validate_runtime.py --skip-timeline

      - name: Build PyInstaller bundle
        run: pyinstaller packaging/aegis.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile Windows installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows-installer.iss'

      - name: Upload onedir bundle
        uses: actions/upload-artifact@v7
        with:
          name: aegis-windows-bundle
          path: dist/Aegis/

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: aegis-windows-installer
          path: packaging/output/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Same guard as the windows job above -- see the comment there for the
      # release this prevents. Both jobs check independently so a tagged build
      # fails fast on whichever runner starts first, and neither can reach the
      # release job with artifacts named for a version the tag doesn't claim.
      - name: Tag matches core/version.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SRC=$(python -c "from core.version import __version__; print(__version__)")
          ISS=$(grep -oE '^#define MyAppVersion "[^"]+"' packaging/windows-installer.iss | sed -E 's/.*"(.*)"/\1/')
          echo "tag=$TAG  core/version.py=$SRC  windows-installer.iss=$ISS"
          [ "$TAG" = "$SRC" ] || { echo "::error::tag $GITHUB_REF_NAME does not match core/version.py ($SRC) -- bump it and re-tag"; exit 1; }
          [ "$ISS" = "$SRC" ] || { echo "::error::packaging/windows-installer.iss ($ISS) does not match core/version.py ($SRC) -- bump both together"; exit 1; }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-common.txt -r requirements-macos.txt pyinstaller

      - name: Runtime smoke validation
        run: python packaging/validate_runtime.py

      - name: Build PyInstaller bundle
        run: pyinstaller packaging/aegis.spec

      - name: Build DMG
        run: packaging/make_dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: aegis-macos-dmg
          path: dist/*.dmg

  # Only runs for an actual version tag (workflow_dispatch has no tag to
  # publish a release under). This is what core/updater.py's "Check for
  # Updates" button reads via the GitHub REST API
  # (repos/{owner}/{repo}/releases/latest) -- workflow *artifacts* (above)
  # aren't fetchable without a signed-in GitHub session, a real Release
  # with attached assets is the only thing an unauthenticated app can pull.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # softprops/action-gh-release needs this to create the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: aegis-macos-dmg
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: aegis-windows-installer
          path: artifacts

      - name: Publish GitHub Release
        # Third-party action, and the ONLY one here holding contents:write --
        # it can create releases people download and auto-install. Pinned to a
        # commit SHA, not a tag: a tag is mutable, so whoever controls that
        # repo (or anyone who compromises it) can silently repoint v3 at new
        # code that runs with this token. GitHub's own actions/* stay on
        # floating majors so they keep receiving security fixes automatically.
        # This SHA is v3.0.2 -- bump it deliberately, or let Dependabot do it.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.exe
          generate_release_notes: true
